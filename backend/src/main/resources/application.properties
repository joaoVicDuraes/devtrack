# ===================================================================
# DevTrack backend configuration
#
# These properties configure a LOCAL MySQL datasource. They assume a
# MySQL server running on the host (localhost:3306) with a database
# named `devtrack`. Requirement 10.4 keeps everything local-only.
#
# For a learning project we keep credentials directly here for simplicity.
# In a real deployment these would come from environment variables or a
# secrets manager, never committed to source control.
# ===================================================================

spring.application.name=devtrack-backend

# --- Datasource (JDBC connection to MySQL) ---
# createDatabaseIfNotExist=true lets MySQL create the `devtrack` schema on
# first connect, so you don't have to create it by hand before running.
# serverTimezone=UTC avoids timezone-related warnings from the driver.
spring.datasource.url=jdbc:mysql://localhost:3306/devtrack?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=3132
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=update lets Hibernate create/adjust tables from the entities on
# startup. This is convenient while learning; a production system would use
# managed migrations (e.g. Flyway) instead.
spring.jpa.hibernate.ddl-auto=update

# Explicitly select the MySQL dialect so Hibernate generates MySQL-compatible SQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Log the SQL Hibernate runs (helpful for learning; turn off if it gets noisy).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
